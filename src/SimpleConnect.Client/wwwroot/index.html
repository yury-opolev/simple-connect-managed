<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Simple Connect</title>
    <base href="/" />
    <link rel="stylesheet" href="css/bootstrap.min.css" />
    <link rel="stylesheet" href="css/bootstrap-icons.min.css" />
    <link rel="stylesheet" href="css/app.css?v=3" />
</head>
<body>
    <div id="app">
        <div class="d-flex justify-content-center align-items-center min-vh-100">
            <div class="text-center">
                <div class="spinner-border text-primary mb-3" role="status"></div>
                <p class="text-muted">Loading Simple Connect...</p>
            </div>
        </div>
    </div>

    <div id="blazor-error-ui" class="alert alert-danger fixed-bottom m-3" style="display:none">
        An unhandled error has occurred.
        <a href="" class="alert-link">Reload</a>
        <a class="dismiss btn-close float-end" aria-label="Close"></a>
    </div>

    <script src="js/acs-interop.js?v=3"></script>
    <script src="js/bootstrap.bundle.min.js"></script>
    <script src="js/site.js"></script>
    <script src="_content/Microsoft.Authentication.WebAssembly.Msal/AuthenticationService.js"></script>
    <script src="_framework/blazor.webassembly.js"></script>
</body>
</html>
